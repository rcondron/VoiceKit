# VoiceKit Configuration
# Copy this file to config.yaml and customize for your setup.
# Environment variables can be referenced as ${VAR_NAME}.

daemon:
  log_level: info
  # log_file: voicekit.log

provider:
  type: openai_realtime
  api_key: ${OPENAI_API_KEY}
  model: gpt-4o-realtime-preview
  voice: alloy  # Options: alloy, echo, fable, onyx, nova, shimmer
  instructions: |
    You are a helpful voice assistant. Be concise and natural in
    your responses. Keep answers brief unless asked for detail.
  turn_detection:
    threshold: 0.5
    silence_duration_ms: 500
    prefix_padding_ms: 300

platforms:
  # Virtual audio device — simplest way to test.
  # Works with VB-Cable (Windows), BlackHole (macOS), PulseAudio (Linux).
  virtual_audio:
    enabled: true
    # Run 'voicekit devices' to see available device names.
    input_device: ""    # e.g., "VB-Cable Output" or "BlackHole 2ch"
    output_device: ""   # e.g., "VB-Cable Input" or "BlackHole 2ch"
    sample_rate: 24000
    channels: 1
    chunk_size: 4800    # 200ms at 24kHz

  # Telegram voice/video calls (audio only, camera off)
  # Requires: pip install voicekit[telegram]
  # Also needs ffmpeg installed on the system.
  # Uses a Telegram user account (not a bot). Get api_id/api_hash from https://my.telegram.org
  telegram:
    enabled: false
    api_id: ${TELEGRAM_API_ID}
    api_hash: ${TELEGRAM_API_HASH}
    phone_number: ""              # Your Telegram phone number
    session_name: voicekit        # Pyrogram session file name
    auto_answer: true
    auto_join_group_calls: false  # Auto-join group voice chats
    allowed_users: []             # Empty = allow all

  # Discord voice channels (audio only, camera off)
  # Requires: pip install voicekit[discord]
  # Also needs libopus and ffmpeg installed on the system.
  # Create a bot at https://discord.com/developers/applications
  discord:
    enabled: false
    bot_token: ${DISCORD_BOT_TOKEN}
    auto_join_channels: []        # Channel IDs to auto-join on startup
    command_prefix: "!vk"         # Bot command prefix (e.g., "!vk join")
    guild_ids: []                 # Restrict to specific guild/server IDs
    listen_to_all_users: true     # Capture audio from all users in channel

  # Zoom meetings — join as a headless bot via Zoom Meeting SDK
  # Requires: pip install voicekit[zoom]
  # Create a Server-to-Server OAuth app at https://marketplace.zoom.us/
  zoom:
    enabled: false
    client_id: ${ZOOM_CLIENT_ID}
    client_secret: ${ZOOM_CLIENT_SECRET}
    account_id: ${ZOOM_ACCOUNT_ID}
    meeting_id: ""              # Zoom meeting number to join
    meeting_passcode: ""        # Meeting passcode (if required)
    display_name: "VoiceKit AI" # Bot display name in meeting
    auto_join: false            # Auto-join meeting on startup
    enable_sdk_log: false       # Enable Zoom SDK debug logging

  # WhatsApp Desktop automation (Phase 3)
  # Requires: PulseAudio (pactl, parec, pacat) and xdotool
  # Routes audio via PulseAudio virtual sinks, detects calls via window polling
  whatsapp:
    enabled: false
    auto_answer: true
    allowed_contacts: []          # Empty = allow all
    process_name: "WhatsApp"      # Process name for PulseAudio stream matching
    pulse_sink_name: "voicekit_whatsapp"  # PulseAudio virtual sink prefix
    # app_path: ""                # Optional: path to WhatsApp Desktop binary

  # Signal Desktop automation (Phase 3)
  # Requires: PulseAudio (pactl, parec, pacat) and xdotool
  # Optional: signal-cli for enhanced call detection
  signal:
    enabled: false
    auto_answer: true
    allowed_contacts: []          # Empty = allow all
    process_name: "Signal"        # Process name for PulseAudio stream matching
    pulse_sink_name: "voicekit_signal"  # PulseAudio virtual sink prefix
    signal_cli_path: "signal-cli" # Path to signal-cli binary (optional)
    phone_number: ""              # Signal phone number (for signal-cli)
    # config_dir: ""              # signal-cli config directory (optional)

  # Slack Huddles (Phase 3)
  # Requires: pip install voicekit[slack]
  # Also needs Slack Desktop + PulseAudio for huddle audio
  # Create a Slack app at https://api.slack.com/apps with Socket Mode enabled
  slack:
    enabled: false
    bot_token: ${SLACK_BOT_TOKEN}   # xoxb-... bot token
    app_token: ${SLACK_APP_TOKEN}   # xapp-... app-level token (Socket Mode)
    auto_join_channels: []          # Channel IDs to auto-join huddles
    command_prefix: "/voicekit"     # Slash command prefix
    process_name: "slack"           # Process name for PulseAudio stream matching
    pulse_sink_name: "voicekit_slack"  # PulseAudio virtual sink prefix

  # SIP/Phone calls — receive and make phone calls via SIP
  # Requires: pip install voicekit[sip]
  # Use with any SIP provider (Twilio, Vonage, FreePBX, etc.)
  sip:
    enabled: false
    server: ""                  # SIP registrar hostname
    username: ""                # SIP username / extension
    password: ""                # SIP password
    port: 5060                  # SIP signalling port
    auto_answer: true           # Auto-answer incoming calls
    allowed_numbers: []         # Empty = allow all callers
    local_rtp_port_start: 10000 # First local UDP port for RTP media
    register_expires: 3600      # SIP registration TTL in seconds
