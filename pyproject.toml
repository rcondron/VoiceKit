[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voicekit"
version = "0.1.0"
description = "Universal AI Voice Bridge — connect AI voice models to any call platform"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "VoiceKit Contributors" }]
keywords = ["voice", "ai", "openai", "realtime", "sip", "telegram", "discord", "slack", "whatsapp", "signal"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Telephony",
    "Topic :: Multimedia :: Sound/Audio",
]

dependencies = [
    "openai>=1.30.0",
    "websockets>=12.0",
    "numpy>=1.26.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pyyaml>=6.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "sounddevice>=0.4.6",
]

[project.optional-dependencies]
telegram = [
    "pyrogram>=2.0",
    "py-tgcalls>=2.1",
]
discord = [
    "discord.py[voice]>=2.3",
    "discord-ext-voice-recv>=0.4",
]
zoom = [
    "zoom-meeting-sdk>=1.0",
    "aiohttp>=3.9",
]
sip = ["aiosip>=0.7"]
browser = ["playwright>=1.40"]
slack = [
    "slack-bolt>=1.18",
    "slack-sdk>=3.21",
]
desktop = [
    # No additional Python dependencies — uses system tools:
    # PulseAudio (pactl, parec, pacat) and xdotool
]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.1.0",
    "mypy>=1.7",
]
all = ["voicekit[telegram,discord,sip,browser,slack,dev]"]

[project.scripts]
voicekit = "voicekit.cli:app"

[project.urls]
Homepage = "https://github.com/voicekit/voicekit"
Repository = "https://github.com/voicekit/voicekit"
Issues = "https://github.com/voicekit/voicekit/issues"

[tool.hatch.build.targets.wheel]
packages = ["voicekit"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
